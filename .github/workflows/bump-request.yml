name: bump-request

on:
  workflow_dispatch:
    inputs:
      version:
        description: Next version (e.g. 1.2.3).
        required: true
        type: string

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: $/
        with:
          command: echo "$VERSION" > VERSION
          version: ${{ inputs.version }}
