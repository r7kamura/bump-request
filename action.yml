name: bump-request
description: Create a pull request that bumps version.
inputs:
  command:
    description: Shell script to update files that contain the version. The next version is available as `VERSION` environment variable.
    required: true
  github_token:
    description: GitHub access token.
    required: false
  version:
    description: Next version (e.g. `1.2.3`).
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - run: node "${{ github.action_path }}/dist/index.js"
      env:
        BUMP_REQUEST_INPUTS_COMMAND: ${{ inputs.command }}
        BUMP_REQUEST_INPUTS_VERSION: ${{ inputs.version }}
        GITHUB_TOKEN: ${{ inputs.github_token || github.token }}
      shell: bash
branding:
  color: blue
  icon: git-pull-request
